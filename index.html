
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#25344a}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#2878d0;color:white;font-weight:bold}
button:hover{opacity:.85}
input,select,textarea{width:100%;padding:10px;border:1px solid #d6dfeb;border-radius:8px;margin:5px 0 12px;font:inherit}
label{font-size:13px;font-weight:bold}
h2,h3{color:#1d4e89}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}
.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:#174d89;color:white;padding:20px;overflow:auto}
.sidebar h2{color:white}
.sidebar button{width:100%;text-align:left;background:transparent;color:white;margin:4px 0}
.sidebar button:hover{background:#286bb2}
.main{margin-left:230px;padding:25px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.stat{background:white;padding:20px;border-radius:12px}
.stat strong{font-size:28px;color:#2878d0;display:block;margin-top:10px}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;text-align:left;border-bottom:1px solid #e6edf5;font-size:13px}
th{background:#eef5fc;color:#24588e}
.tablewrap{overflow-x:auto}
.actions button{margin:2px;padding:7px;font-size:12px}
.danger{background:#dc4545}
.symptoms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.symptoms label{font-weight:normal;display:flex;align-items:center;gap:6px;padding:8px;background:#f4f8fc;border-radius:6px}
.symptoms input{width:auto;margin:0}
.small{font-size:12px;color:#718096}
hr{border:0;border-top:1px solid #e5edf5;margin:20px 0}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f3ff;color:#1763a5;font-size:12px}
@media(max-width:700px){
.sidebar{position:relative;width:100%;height:auto}
.sidebar button{width:auto;display:inline-block}
.main{margin-left:0;padding:12px}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>🏥 HMS</h2>
<p class="small" style="color:#dbeafe">Hospital Management System</p>
<hr>
<button onclick="page('dashboard')">🏠 Dashboard</button>
<button onclick="page('patients')">👥 Patients & Doctors</button>
<button onclick="page('appointments')">📅 Appointments</button>
<button onclick="page('diagnoses')">🩺 Diagnoses</button>
<button onclick="page('records')">📋 Medical Records</button>
<button onclick="page('rooms')">🛏️ Rooms</button>
<button onclick="page('billing')">💳 Billing</button>
<button onclick="page('settings')">⚙️ Settings</button>
</div>

<!-- MAIN -->
<div class="main">
<div class="topbar">
<h2 id="pageTitle">Dashboard</h2>
<span class="badge">Hospital Management System</span>
</div>
<div id="content"></div>
</div>

<script>
"use strict";

/* =========================
   DATABASE
========================= */

const KEY="hospital_system_no_login";

let data={
 patients:[],
 doctors:[],
 appointments:[],
 diagnoses:[],
 rooms:[],
 bills:[]
};

function load(){
 try{
  const saved=localStorage.getItem(KEY);
  if(saved)data={...data,...JSON.parse(saved)};
 }catch(e){
  console.error(e);
 }
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

load();

/* =========================
   NAVIGATION
========================= */

let currentPage="dashboard";

function page(name){
 currentPage=name;

 const titles={
  dashboard:"Dashboard",
  patients:"Patients & Doctors",
  appointments:"Appointments",
  diagnoses:"Diagnoses",
  records:"Medical Records",
  rooms:"Rooms",
  billing:"Billing",
  settings:"Settings"
 };

 document.getElementById("pageTitle").textContent=titles[name];
 render();
}

/* =========================
   DASHBOARD
========================= */

function dashboard(){
 return `
 <div class="grid">
 <div class="stat">Total Patients<strong>${data.patients.length}</strong></div>
 <div class="stat">Total Doctors<strong>${data.doctors.length}</strong></div>
 <div class="stat">Appointments<strong>${data.appointments.length}</strong></div>
 <div class="stat">Occupied Rooms<strong>${data.rooms.filter(r=>r.status==="Occupied").length}</strong></div>
 </div>

 <div class="card">
 <h3>Welcome to the Hospital Management System</h3>
 <p>Manage hospital patients, doctors, appointments, diagnoses, medical records, rooms and billing.</p>
 </div>

 <div class="card">
 <h3>Recent Patients</h3>
 ${patientTable(data.patients.slice(-5).reverse(),false)}
 </div>
 `;
}

/* =========================
   PATIENTS
========================= */

const symptomList=[
"Fever","Cough","Cold / Runny Nose","Sore Throat","Headache",
"Dizziness","Difficulty Breathing","Chest Pain","Stomach Pain",
"Nausea","Vomiting","Diarrhea","Constipation","Body Pain",
"Muscle Pain","Back Pain","Joint Pain","Fatigue / Weakness",
"Loss of Appetite","Skin Rash","Itching","Swelling","Bleeding",
"High Blood Pressure","Fast Heartbeat","Blurred Vision",
"Difficulty Sleeping","Anxiety / Nervousness","Other"
];

const specialties=[
"General Medicine","Internal Medicine","Cardiology","Pulmonology",
"Neurology","Gastroenterology","Dermatology","Orthopedics",
"Ophthalmology","Pediatrics","Obstetrics and Gynecology",
"Psychiatry","ENT","Urology","Nephrology","Oncology",
"Endocrinology","Dentistry","Other"
];

function symptomOptions(){
 return symptomList.map(s=>
 `<label><input type="checkbox" class="symptomCheck" value="${esc(s)}"> ${esc(s)}</label>`
 ).join("");
}

function suggestedSpecialty(symptoms){
 if(symptoms.includes("Difficulty Breathing"))return "Pulmonology";
 if(symptoms.includes("Chest Pain")||symptoms.includes("Fast Heartbeat"))return "Cardiology";
 if(symptoms.includes("Blurred Vision"))return "Ophthalmology";
 if(symptoms.includes("Headache")||symptoms.includes("Dizziness"))return "Neurology";
 if(symptoms.some(s=>["Stomach Pain","Nausea","Vomiting","Diarrhea","Constipation"].includes(s)))return "Gastroenterology";
 if(symptoms.some(s=>["Skin Rash","Itching"].includes(s)))return "Dermatology";
 if(symptoms.some(s=>["Back Pain","Muscle Pain","Joint Pain"].includes(s)))return "Orthopedics";
 if(symptoms.includes("High Blood Pressure"))return "Internal Medicine";
 return "General Medicine";
}

function patientsPage(){
 return `
 <div class="card">
 <h3>Add Patient</h3>

 <form id="patientForm">
 <div class="grid">
 <div><label>Patient Name</label><input name="name" required></div>
 <div><label>Age</label><input name="age" type="number" min="0" required></div>
 <div><label>Gender</label>
 <select name="gender" required>
 <option value="">Select</option>
 <option>Male</option><option>Female</option><option>Other</option>
 </select></div>
 <div><label>Contact</label><input name="contact"></div>
 </div>

 <label>Address</label><input name="address">

 <hr>
 <h3>Symptoms</h3>
 <div class="symptoms">${symptomOptions()}</div>

 <label>Other Symptoms</label>
 <textarea name="otherSymptoms"></textarea>

 <div class="grid">
 <div><label>Duration</label><input name="duration" placeholder="e.g. 2 days"></div>
 <div><label>Severity</label>
 <select name="severity">
 <option>Not specified</option><option>Mild</option><option>Moderate</option><option>Severe</option>
 </select></div>
 </div>

 <label>Notes</label><textarea name="notes"></textarea>

 <label>Suggested Specialty</label>
 <input id="suggested" readonly>

 <label>Assign Doctor</label>
 <select name="doctor" id="assignDoctor">
 <option value="">No doctor assigned</option>
 </select>

 <button type="submit">Add Patient</button>
 </form>
 <p class="small">Specialty suggestions are not medical diagnoses.</p>
 </div>

 <div class="card">
 <h3>Patient List</h3>
 <input id="patientSearch" placeholder="Search patient name or ID..." oninput="renderPatientList()">
 <div id="patientList"></div>
 </div>

 <div class="card">
 <h3>Doctors</h3>
 <form id="doctorForm">
 <div class="grid">
 <div><label>Doctor Name</label><input name="name" required></div>
 <div><label>Specialization</label>
 <select name="specialty" required>
 ${specialties.map(s=>`<option>${esc(s)}</option>`).join("")}
 </select></div>
 <div><label>Contact</label><input name="contact"></div>
 </div>
 <button type="submit">Add Doctor</button>
 </form>
 <div id="doctorList"></div>
 </div>
 `;
}

function doctorSelectOptions(){
 return data.doctors.map(d=>
 `<option value="${d.id}">${esc(d.name)} — ${esc(d.specialty)}</option>`
 ).join("");
}

function patientTable(list,showActions=true){
 if(!list.length)return "<p class='small'>No patients found.</p>";

 return `
 <div class="tablewrap">
 <table>
 <thead>
 <tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Contact</th>${showActions?"<th>Actions</th>":""}</tr>
 </thead>
 <tbody>
 ${list.map(p=>`
 <tr>
 <td>${esc(p.id)}</td>
 <td>${esc(p.name)}</td>
 <td>${esc(p.age)}</td>
 <td>${esc(p.gender)}</td>
 <td>${esc(p.contact||"-")}</td>
 ${showActions?`
 <td class="actions">
 <button onclick="editPatient('${p.id}')">Edit</button>
 <button class="danger" onclick="deletePatient('${p.id}')">Delete</button>
 </td>`:""}
 </tr>`).join("")}
 </tbody>
 </table>
 </div>`;
}

function renderPatientList(){
 const q=(document.getElementById("patientSearch")?.value||"").toLowerCase();
 const list=data.patients.filter(p=>(p.name+" "+p.id).toLowerCase().includes(q));
 const el=document.getElementById("patientList");
 if(el)el.innerHTML=patientTable(list);
}

function renderDoctorList(){
 const el=document.getElementById("doctorList");
 if(!el)return;

 if(!data.doctors.length){
  el.innerHTML="<p>No doctors added yet.</p>";
  return;
 }

 el.innerHTML=`
 <div class="tablewrap">
 <table>
 <thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Contact</th><th>Assigned Patients</th><th>Actions</th></tr></thead>
 <tbody>
 ${data.doctors.map(d=>{
 const assigned=data.patients.filter(p=>p.doctor===d.id).map(p=>p.name);
 return `
 <tr>
 <td>${esc(d.id)}</td>
 <td>${esc(d.name)}</td>
 <td>${esc(d.specialty)}</td>
 <td>${esc(d.contact||"-")}</td>
 <td>${esc(assigned.join(", ")||"None")}</td>
 <td><button class="danger" onclick="deleteDoctor('${d.id}')">Delete</button></td>
 </tr>`;
 }).join("")}
 </tbody>
 </table>
 </div>`;
}

function bindPatientDoctorForms(){
 const pf=document.getElementById("patientForm");
 const df=document.getElementById("doctorForm");

 if(pf){
  const select=document.getElementById("assignDoctor");
  select.innerHTML='<option value="">No doctor assigned</option>'+doctorSelectOptions();

  pf.addEventListener("change",()=>{
   const symptoms=[...document.querySelectorAll(".symptomCheck:checked")].map(x=>x.value);
   const spec=suggestedSpecialty(symptoms);
   document.getElementById("suggested").value=symptoms.length?spec:"";

   if(symptoms.length){
    const matching=data.doctors.filter(d=>d.specialty===spec);
    if(matching.length)select.value=matching[0].id;
   }
  });

  pf.addEventListener("submit",e=>{
   e.preventDefault();
   const f=new FormData(pf);
   const symptoms=[...document.querySelectorAll(".symptomCheck:checked")].map(x=>x.value);

   data.patients.push({
    id:"P"+Date.now(),
    name:f.get("name"),
    age:f.get("age"),
    gender:f.get("gender"),
    contact:f.get("contact"),
    address:f.get("address"),
    symptoms,
    otherSymptoms:f.get("otherSymptoms"),
    duration:f.get("duration"),
    severity:f.get("severity"),
    notes:f.get("notes"),
    suggested:document.getElementById("suggested").value,
    doctor:f.get("doctor")
   });

   save();
   alert("Patient added successfully.");
   page("patients");
  });
 }

 if(df){
  df.addEventListener("submit",e=>{
   e.preventDefault();
   const f=new FormData(df);

   data.doctors.push({
    id:"D"+Date.now(),
    name:f.get("name"),
    specialty:f.get("specialty"),
    contact:f.get("contact")
   });

   save();
   page("patients");
  });
 }
}

function editPatient(id){
 const p=data.patients.find(x=>x.id===id);
 if(!p)return;

 const name=prompt("Patient name:",p.name);
 if(name===null)return;
 p.name=name.trim()||p.name;

 const age=prompt("Patient age:",p.age);
 if(age!==null)p.age=age;

 const contact=prompt("Patient contact:",p.contact||"");
 if(contact!==null)p.contact=contact;

 save();
 page("patients");
}

function deletePatient(id){
 if(!confirm("Delete this patient?"))return;
 data.patients=data.patients.filter(p=>p.id!==id);
 save();
 page("patients");
}

function deleteDoctor(id){
 if(!confirm("Delete this doctor?"))return;
 data.doctors=data.doctors.filter(d=>d.id!==id);
 data.patients.forEach(p=>{if(p.doctor===id)p.doctor=""});
 save();
 page("patients");
}

/* =========================
   APPOINTMENTS
========================= */

function appointmentsPage(){
 return `
 <div class="card">
 <h3>Add Appointment</h3>
 <form id="appointmentForm">
 <div class="grid">
 <div><label>Patient</label>
 <select name="patient" required>
 <option value="">Select Patient</option>
 ${data.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
 </select></div>

 <div><label>Doctor</label>
 <select name="doctor" required>
 <option value="">Select Doctor</option>${doctorSelectOptions()}
 </select></div>

 <div><label>Date</label><input type="date" name="date" required></div>
 <div><label>Time</label><input type="time" name="time" required></div>
 </div>

 <label>Status</label>
 <select name="status"><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select>

 <label>Notes</label><textarea name="notes"></textarea>
 <button type="submit">Add Appointment</button>
 </form>
 </div>

 <div class="card"><h3>Appointments</h3><div id="appointmentList"></div></div>
 `;
}

function renderAppointments(){
 const el=document.getElementById("appointmentList");
 if(!el)return;

 if(!data.appointments.length){el.innerHTML="<p>No appointments.</p>";return;}

 el.innerHTML=`
 <div class="tablewrap">
 <table>
 <thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead>
 <tbody>
 ${data.appointments.map(a=>`
 <tr>
 <td>${esc(patientName(a.patient))}</td>
 <td>${esc(doctorName(a.doctor))}</td>
 <td>${esc(a.date)}</td>
 <td>${esc(a.time)}</td>
 <td>${esc(a.status)}</td>
 <td>${esc(a.notes||"-")}</td>
 <td><button class="danger" onclick="deleteAppointment('${a.id}')">Delete</button></td>
 </tr>`).join("")}
 </tbody>
 </table>
 </div>`;
}

function bindAppointmentForm(){
 const f=document.getElementById("appointmentForm");
 if(!f)return;

 f.addEventListener("submit",e=>{
  e.preventDefault();
  const fd=new FormData(f);

  data.appointments.push({
   id:"A"+Date.now(),
   patient:fd.get("patient"),
   doctor:fd.get("doctor"),
   date:fd.get("date"),
   time:fd.get("time"),
   status:fd.get("status"),
   notes:fd.get("notes")
  });

  save();
  page("appointments");
 });
}

function deleteAppointment(id){
 if(!confirm("Delete appointment?"))return;
 data.appointments=data.appointments.filter(a=>a.id!==id);
 save();
 page("appointments");
}

/* =========================
   DIAGNOSES
========================= */

function diagnosesPage(){
 return `
 <div class="card">
 <h3>Add Diagnosis Record</h3>
 <form id="diagnosisForm">
 <div class="grid">
 <div><label>Patient</label>
 <select name="patient" required>
 <option value="">Select patient</option>
 ${data.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
 </select></div>

 <div><label>Doctor</label>
 <select name="doctor" required>
 <option value="">Select doctor</option>${doctorSelectOptions()}
 </select></div>

 <div><label>Date</label><input type="date" name="date" required></div>
 </div>

 <label>Diagnosis</label><input name="diagnosis" required>
 <label>Treatment</label><textarea name="treatment"></textarea>
 <label>Notes</label><textarea name="notes"></textarea>
 <button type="submit">Save Diagnosis</button>
 </form>
 </div>

 <div class="card"><h3>Diagnosis List</h3><div id="diagnosisList"></div></div>
 `;
}

function renderDiagnoses(){
 const el=document.getElementById("diagnosisList");
 if(!el)return;
 if(!data.diagnoses.length){el.innerHTML="<p>No records.</p>";return;}

 el.innerHTML=`
 <div class="tablewrap">
 <table>
 <thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Diagnosis</th><th>Treatment</th><th>Notes</th><th>Actions</th></tr></thead>
 <tbody>
 ${data.diagnoses.map(d=>`
 <tr>
 <td>${esc(patientName(d.patient))}</td>
 <td>${esc(doctorName(d.doctor))}</td>
 <td>${esc(d.date)}</td>
 <td>${esc(d.diagnosis)}</td>
 <td>${esc(d.treatment||"-")}</td>
 <td>${esc(d.notes||"-")}</td>
 <td><button class="danger" onclick="deleteDiagnosis('${d.id}')">Delete</button></td>
 </tr>`).join("")}
 </tbody>
 </table>
 </div>`;
}

function bindDiagnosisForm(){
 const f=document.getElementById("diagnosisForm");
 if(!f)return;

 f.addEventListener("submit",e=>{
  e.preventDefault();
  const fd=new FormData(f);

  data.diagnoses.push({
   id:"DX"+Date.now(),
   patient:fd.get("patient"),
   doctor:fd.get("doctor"),
   date:fd.get("date"),
   diagnosis:fd.get("diagnosis"),
   treatment:fd.get("treatment"),
   notes:fd.get("notes")
  });

  save();
  page("diagnoses");
 });
}

function deleteDiagnosis(id){
 if(!confirm("Delete diagnosis record?"))return;
 data.diagnoses=data.diagnoses.filter(d=>d.id!==id);
 save();
 page("diagnoses");
}

/* =========================
   MEDICAL RECORDS
========================= */

function recordsPage(){
 return `
 <div class="card">
 <h3>Search Patient Medical History</h3>
 <input id="recordSearch" placeholder="Enter patient name or ID..." oninput="searchRecords()">
 <div id="recordResults"></div>
 </div>`;
}

function searchRecords(){
 const q=(document.getElementById("recordSearch")?.value||"").toLowerCase();
 const el=document.getElementById("recordResults");
 if(!el)return;
 if(!q){el.innerHTML="";return;}

 const list=data.patients.filter(p=>(p.name+" "+p.id).toLowerCase().includes(q));
 if(!list.length){el.innerHTML="<p>No patients found.</p>";return;}

 el.innerHTML=list.map(p=>{
  const dx=data.diagnoses.filter(d=>d.patient===p.id);
  const ap=data.appointments.filter(a=>a.patient===p.id);
  const bills=data.bills.filter(b=>b.patient===p.id);

  return `
  <div class="card">
  <h3>${esc(p.name)}</h3>
  <p><b>Patient ID:</b> ${esc(p.id)}</p>
  <p><b>Age:</b> ${esc(p.age)} | <b>Gender:</b> ${esc(p.gender)}</p>
  <p><b>Contact:</b> ${esc(p.contact||"-")}</p>
  <p><b>Address:</b> ${esc(p.address||"-")}</p>
  <p><b>Symptoms:</b> ${esc((p.symptoms||[]).join(", ")||"-")}</p>
  <p><b>Other Symptoms:</b> ${esc(p.otherSymptoms||"-")}</p>
  <p><b>Duration:</b> ${esc(p.duration||"-")}</p>
  <p><b>Severity:</b> ${esc(p.severity||"-")}</p>
  <p><b>Suggested Specialty:</b> ${esc(p.suggested||"-")}</p>
  <p><b>Assigned Doctor:</b> ${esc(doctorName(p.doctor))}</p>
  <p><b>Notes:</b> ${esc(p.notes||"-")}</p>

  <hr><h3>Diagnosis History</h3>
  ${dx.length?dx.map(d=>`
  <p><b>${esc(d.date)}</b> — ${esc(d.diagnosis)}<br>
  Doctor: ${esc(doctorName(d.doctor))}<br>
  Treatment: ${esc(d.treatment||"-")}<br>
  Notes: ${esc(d.notes||"-")}</p>`).join(""):"<p>No diagnosis records.</p>"}

  <hr><h3>Appointment History</h3>
  ${ap.length?ap.map(a=>`
  <p>${esc(a.date)} ${esc(a.time)} — ${esc(doctorName(a.doctor))} — ${esc(a.status)}</p>`).join(""):"<p>No appointments.</p>"}

  <hr><h3>Billing History</h3>
  ${bills.length?bills.map(b=>`
  <p>Date: ${esc(b.date)} | Total: ${money(b.total)} | Status: ${esc(b.status)} | Balance: ${money(b.balance)}</p>`).join(""):"<p>No billing records.</p>"}
  </div>`;
 }).join("");
}

/* =========================
   ROOMS
========================= */

function roomsPage(){
 return `
 <div class="grid">
 <div class="stat">Occupied<strong>${data.rooms.filter(r=>r.status==="Occupied").length}</strong></div>
 <div class="stat">Not Occupied<strong>${data.rooms.filter(r=>r.status==="Not Occupied").length}</strong></div>
 </div>

 <div class="card">
 <h3>Add Room</h3>
 <form id="roomForm">
 <div class="grid">
 <div><label>Room Number</label><input name="number" required></div>
 <div><label>Status</label>
 <select name="status"><option>Not Occupied</option><option>Occupied</option></select></div>
 <div><label>Patient</label>
 <select name="patient"><option value="">None</option>
 ${data.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
 </select></div>
 </div>
 <button type="submit">Add Room</button>
 </form>
 </div>

 <div class="card"><h3>Room List</h3><div id="roomList"></div></div>
 `;
}

function renderRooms(){
 const el=document.getElementById("roomList");
 if(!el)return;
 if(!data.rooms.length){el.innerHTML="<p>No rooms added.</p>";return;}

 el.innerHTML=`
 <div class="tablewrap">
 <table>
 <thead><tr><th>Room</th><th>Status</th><th>Patient</th><th>Actions</th></tr></thead>
 <tbody>
 ${data.rooms.map(r=>`
 <tr>
 <td>${esc(r.number)}</td>
 <td>${esc(r.status)}</td>
 <td>${esc(patientName(r.patient)||"-")}</td>
 <td>
 <button onclick="toggleRoom('${r.id}')">Change Status</button>
 <button class="danger" onclick="deleteRoom('${r.id}')">Delete</button>
 </td>
 </tr>`).join("")}
 </tbody>
 </table>
 </div>`;
}

function bindRoomForm(){
 const f=document.getElementById("roomForm");
 if(!f)return;

 f.addEventListener("submit",e=>{
  e.preventDefault();
  const fd=new FormData(f);

  if(data.rooms.some(r=>r.number===fd.get("number"))){
   alert("Room number already exists.");
   return;
  }

  data.rooms.push({
   id:"R"+Date.now(),
   number:fd.get("number"),
   status:fd.get("status"),
   patient:fd.get("status")==="Occupied"?fd.get("patient"):""
  });

  save();
  page("rooms");
 });
}

function toggleRoom(id){
 const r=data.rooms.find(x=>x.id===id);
 if(!r)return;

 if(r.status==="Occupied"){
  r.status="Not Occupied";
  r.patient="";
 }else{
  r.status="Occupied";
  r.patient=prompt("Enter patient ID for this room, or leave blank:")||"";
 }

 save();
 page("rooms");
}

function deleteRoom(id){
 if(!confirm("Delete room?"))return;
 data.rooms=data.rooms.filter(r=>r.id!==id);
 save();
 page("rooms");
}

/* =========================
   BILLING
========================= */

function billingPage(){
 return `
 <div class="card">
 <h3>Add Billing Record</h3>
 <form id="billForm">
 <label>Patient</label>
 <select name="patient" required>
 <option value="">Select patient</option>
 ${data.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
 </select>

 <div class="grid">
 <div><label>Room Fee</label><input name="roomFee" type="number" min="0" value="0"></div>
 <div><label>Services</label><input name="services" type="number" min="0" value="0"></div>
 <div><label>Medication</label><input name="medication" type="number" min="0" value="0"></div>
 <div><label>Laboratory</label><input name="lab" type="number" min="0" value="0"></div>
 <div><label>Payment Received</label><input name="paid" type="number" min="0" value="0"></div>
 </div>

 <button type="submit">Save Billing</button>
 </form>
 </div>

 <div class="card">
 <h3>Billing Search</h3>
 <input id="billSearch" placeholder="Search patient name or ID..." oninput="renderBills()">
 <div id="billList"></div>
 </div>`;
}

function bindBillForm(){
 const f=document.getElementById("billForm");
 if(!f)return;

 f.addEventListener("submit",e=>{
  e.preventDefault();
  const fd=new FormData(f);

  const roomFee=Number(fd.get("roomFee"))||0;
  const services=Number(fd.get("services"))||0;
  const medication=Number(fd.get("medication"))||0;
  const lab=Number(fd.get("lab"))||0;
  const paid=Number(fd.get("paid"))||0;
  const total=roomFee+services+medication+lab;
  const balance=Math.max(total-paid,0);
  const status=balance<=0?"Paid":paid>0?"Partially Paid":"Pending";

  data.bills.push({
   id:"B"+Date.now(),
   patient:fd.get("patient"),
   date:new Date().toLocaleDateString(),
   roomFee,services,medication,lab,total,paid,balance,status
  });

  save();
  page("billing");
 });
}

function renderBills(){
 const el=document.getElementById("billList");
 if(!el)return;

 const q=(document.getElementById("billSearch")?.value||"").toLowerCase();
 const list=data.bills.filter(b=>(patientName(b.patient)+" "+b.patient).toLowerCase().includes(q));

 if(!list.length){el.innerHTML="<p>No billing records found.</p>";return;}

 el.innerHTML=`
 <div class="tablewrap">
 <table>
 <thead><tr><th>Patient</th><th>Date</th><th>Room</th><th>Services</th><th>Medication</th><th>Lab</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
 <tbody>
 ${list.map(b=>`
 <tr>
 <td>${esc(patientName(b.patient))}</td>
 <td>${esc(b.date)}</td>
 <td>${money(b.roomFee)}</td>
 <td>${money(b.services)}</td>
 <td>${money(b.medication)}</td>
 <td>${money(b.lab)}</td>
 <td>${money(b.total)}</td>
 <td>${money(b.paid)}</td>
 <td>${money(b.balance)}</td>
 <td>${esc(b.status)}</td>
 <td><button class="danger" onclick="deleteBill('${b.id}')">Delete</button></td>
 </tr>`).join("")}
 </tbody>
 </table>
 </div>

 <h3>Total Billing: ${money(list.reduce((s,b)=>s+b.total,0))}</h3>
 <h3>Total Received: ${money(list.reduce((s,b)=>s+b.paid,0))}</h3>
 <h3>Total Balance: ${money(list.reduce((s,b)=>s+b.balance,0))}</h3>`;
}

function deleteBill(id){
 if(!confirm("Delete billing record?"))return;
 data.bills=data.bills.filter(b=>b.id!==id);
 save();
 page("billing");
}

/* =========================
   SETTINGS
========================= */

function settingsPage(){
 return `
 <div class="card">
 <h3>System Settings</h3>
 <p>Hospital Management System</p>
 <p>Version 1.0</p>
 <p>Storage: Browser localStorage</p>
 <p class="small">This system is a school project prototype. Do not use it to store real patient information.</p>
 </div>

 <div class="card">
 <h3>Data Management</h3>
 <button onclick="exportData()">Export System Data</button>
 <button class="danger" onclick="resetSystem()">Reset All System Data</button>
 </div>
 `;
}

function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="hospital_data.json";
 a.click();
 URL.revokeObjectURL(url);
}

function resetSystem(){
 if(!confirm("Delete all system records?"))return;
 localStorage.removeItem(KEY);
 location.reload();
}

/* =========================
   HELPERS
========================= */

function patientName(id){
 return data.patients.find(p=>p.id===id)?.name||"Unknown";
}

function doctorName(id){
 return data.doctors.find(d=>d.id===id)?.name||"Unassigned";
}

function money(n){
 return "₱"+(Number(n)||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 }[c]));
}

/* =========================
   RENDER
========================= */

function render(){
 const el=document.getElementById("content");
 if(!el)return;

 switch(currentPage){

 case "dashboard":
  el.innerHTML=dashboard();
  break;

 case "patients":
  el.innerHTML=patientsPage();
  bindPatientDoctorForms();
  renderPatientList();
  renderDoctorList();
  break;

 case "appointments":
  el.innerHTML=appointmentsPage();
  bindAppointmentForm();
  renderAppointments();
  break;

 case "diagnoses":
  el.innerHTML=diagnosesPage();
  bindDiagnosisForm();
  renderDiagnoses();
  break;

 case "records":
  el.innerHTML=recordsPage();
  break;

 case "rooms":
  el.innerHTML=roomsPage();
  bindRoomForm();
  renderRooms();
  break;

 case "billing":
  el.innerHTML=billingPage();
  bindBillForm();
  renderBills();
  break;

 case "settings":
  el.innerHTML=settingsPage();
  break;

 default:
  el.innerHTML=dashboard();
 }
}

/* =========================
   OPEN DASHBOARD DIRECTLY
========================= */

page("dashboard");

</script>
</body>
</html>
