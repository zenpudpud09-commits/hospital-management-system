 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hospital Management System</title>
<style>
:root{
 --pink:#e878a7;--dark:#bd477b;--light:#fff0f6;
 --white:#fff;--text:#5d4350;--border:#f1d5e2;
}
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;color:var(--text);
 background:#fff7fb url('hospital-background.png') center/cover fixed;
}
button,input,select{font:inherit}
button{
 background:var(--pink);color:white;border:none;padding:10px 16px;
 border-radius:9px;cursor:pointer;margin:3px;
}
button:hover{background:var(--dark)}
button.secondary{background:#f4d8e5;color:#7c3555}
button.danger{background:#d95376}
input,select{
 padding:11px;border:1px solid var(--border);border-radius:9px;
 width:100%;margin:5px 0;background:white;color:var(--text);
}
.auth{
 max-width:400px;margin:8vh auto;background:white;padding:28px;
 border-radius:20px;box-shadow:0 8px 30px #e8b8ce;
}
.auth h1{text-align:center;color:var(--dark)}
.auth small{display:block;text-align:center;margin-bottom:18px}
#app{display:none;min-height:100vh}
.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:220px;
 background:#fff;padding:20px;box-shadow:2px 0 12px #edd5e0;
 overflow-y:auto;
}
.sidebar h2{color:var(--dark)}
.sidebar button{width:100%;text-align:left;margin:6px 0}
.main{margin-left:220px;padding:25px}
.card{
 background:white;border-radius:16px;padding:20px;margin-bottom:18px;
 box-shadow:0 4px 15px #e9cbd9;
}
h1,h2,h3{color:var(--dark)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;margin-top:15px;background:white}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left}
th{background:var(--light);color:var(--dark)}
.table-wrap{overflow-x:auto}
.form-grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:10px;
}
.hidden{display:none!important}
.info{
 background:#fff5f9;padding:12px;border-radius:10px;margin:10px 0;
}
.actions{white-space:nowrap}
@media(max-width:700px){
 .sidebar{position:relative;width:100%;height:auto}
 .main{margin-left:0;padding:12px}
 .sidebar button{width:auto}
}
</style>
</head>
<body>

<div id="auth" class="auth">
 <h1>Hospital Management System</h1>
 <small>Patient, Doctor, Appointment and Billing Management</small>
 <div id="loginForm">
  <input id="loginUser" placeholder="Username">
  <input id="loginPass" type="password" placeholder="Password">
  <button class="secondary" onclick="togglePassword('loginPass')">Show / Hide Password</button>
  <button style="width:100%" onclick="login()">Login</button>
  <p style="text-align:center">No account yet?</p>
  <button class="secondary" style="width:100%" onclick="showSignup()">Sign Up</button>
 </div>
 <div id="signupForm" class="hidden">
  <input id="newUser" placeholder="Create Username">
  <input id="newPass" type="password" placeholder="Create Password">
  <button class="secondary" onclick="togglePassword('newPass')">Show / Hide Password</button>
  <button style="width:100%" onclick="signup()">Create Account</button>
  <button class="secondary" style="width:100%" onclick="showLogin()">Back to Login</button>
 </div>
</div>

<div id="app">
 <aside class="sidebar">
  <h2>Hospital Management System</h2>
  <button onclick="page('dashboard')">Dashboard</button>
  <button onclick="page('patients')">Patients</button>
  <button onclick="page('doctors')">Doctors</button>
  <button onclick="page('appointments')">Appointments</button>
  <button onclick="page('billing')">Billing</button>
  <hr>
  <button class="secondary" onclick="logout()">Logout</button>
 </aside>
 <main class="main">
  <div id="content"></div>
 </main>
</div>

<script>
const KEY={
 accounts:'hms_demo_accounts',
 session:'hms_demo_logged_in',
 patients:'hms_demo_patients',
 doctors:'hms_demo_doctors',
 appointments:'hms_demo_appointments',
 billing:'hms_demo_billing'
};

let patients=load(KEY.patients);
let doctors=load(KEY.doctors);
let appointments=load(KEY.appointments);
let billing=load(KEY.billing);
let editing=null;
let currentPage='dashboard';

function load(k){
 try{return JSON.parse(localStorage.getItem(k)||'[]')}
 catch{return []}
}
function save(){
 localStorage.setItem(KEY.patients,JSON.stringify(patients));
 localStorage.setItem(KEY.doctors,JSON.stringify(doctors));
 localStorage.setItem(KEY.appointments,JSON.stringify(appointments));
 localStorage.setItem(KEY.billing,JSON.stringify(billing));
}
function uid(){return Date.now().toString()+Math.random().toString(16).slice(2)}
function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function togglePassword(id){
 let e=document.getElementById(id);
 e.type=e.type==='password'?'text':'password';
}
function showSignup(){
 document.getElementById('loginForm').classList.add('hidden');
 document.getElementById('signupForm').classList.remove('hidden');
}
function showLogin(){
 document.getElementById('signupForm').classList.add('hidden');
 document.getElementById('loginForm').classList.remove('hidden');
}
function signup(){
 let u=document.getElementById('newUser').value.trim();
 let p=document.getElementById('newPass').value;
 if(!u||!p)return alert('Please fill in both fields.');
 let a=load(KEY.accounts);
 if(a.some(x=>x.user.toLowerCase()===u.toLowerCase()))
  return alert('Username already exists.');
 a.push({user:u,pass:p});
 localStorage.setItem(KEY.accounts,JSON.stringify(a));
 alert('Account created! You can now log in.');
 showLogin();
}
function login(){
 let u=document.getElementById('loginUser').value.trim();
 let p=document.getElementById('loginPass').value;
 let a=load(KEY.accounts);
 if(!a.some(x=>x.user===u&&x.pass===p))
  return alert('Incorrect username or password.');
 localStorage.setItem(KEY.session,u);
 start();
}
function logout(){
 localStorage.removeItem(KEY.session);
 document.getElementById('app').style.display='none';
 document.getElementById('auth').style.display='block';
}
function start(){
 if(!localStorage.getItem(KEY.session))return;
 document.getElementById('auth').style.display='none';
 document.getElementById('app').style.display='block';
 page('dashboard');
}
function page(p){
 currentPage=p;editing=null;
 render();
}
function render(){
 const c=document.getElementById('content');
 if(currentPage==='dashboard')dashboard(c);
 if(currentPage==='patients')patientPage(c);
 if(currentPage==='doctors')doctorPage(c);
 if(currentPage==='appointments')appointmentPage(c);
 if(currentPage==='billing')billingPage(c);
}
function dashboard(c){
 c.innerHTML=`
 <h1>Dashboard</h1>
 <div class="card">
 <div class="toolbar">
 <input id="dashSearch" placeholder="Search patients..." oninput="searchDash()">
 <button onclick="page('patients')">+ Add Patient</button>
 </div>
 <div id="dashList"></div>
 </div>`;
 searchDash();
}
function searchDash(){
 let q=(document.getElementById('dashSearch')?.value||'').toLowerCase();
 let list=patients.filter(p=>
  (p.name+' '+p.contact+' '+p.id).toLowerCase().includes(q));
 let el=document.getElementById('dashList');
 if(!el)return;
 el.innerHTML=list.length?`
 <div class="table-wrap"><table>
 <tr><th>Patient</th><th>Contact</th><th>Action</th></tr>
 ${list.map(p=>`<tr>
 <td>${esc(p.name)}</td><td>${esc(p.contact)}</td>
 <td><button onclick="openPatient('${p.id}')">Open</button></td>
 </tr>`).join('')}
 </table></div>`:'<p>No patients found.</p>';
}
function openPatient(id){
 let p=patients.find(x=>x.id===id);
 if(!p)return;
 let ap=appointments.filter(x=>x.patientId===id);
 let bills=billing.filter(x=>x.patientId===id);
 document.getElementById('content').innerHTML=`
 <h1>Patient Details</h1>
 <div class="card">
 <h2>${esc(p.name)}</h2>
 <div class="info">
 <p><b>Age:</b> ${esc(p.age)}</p>
 <p><b>Gender:</b> ${esc(p.gender)}</p>
 <p><b>Contact:</b> ${esc(p.contact)}</p>
 <p><b>Address:</b> ${esc(p.address)}</p>
 </div>
 <button onclick="editPatient('${p.id}')">Edit Patient</button>
 <button class="secondary" onclick="page('dashboard')">Back</button>
 </div>
 <div class="card"><h2>Appointments</h2>
 ${ap.length?`<div class="table-wrap"><table>
 <tr><th>Doctor</th><th>Specialization</th><th>Date</th><th>Time</th><th>Status</th></tr>
 ${ap.map(a=>{
 let d=doctors.find(x=>x.id===a.doctorId);
 return `<tr><td>${esc(d?.name||'Unknown')}</td>
 <td>${esc(d?.specialization||'')}</td>
 <td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(a.status)}</td></tr>`;
 }).join('')}
 </table></div>`:'<p>No appointments.</p>'}
 </div>
 <div class="card"><h2>Billing</h2>
 ${bills.length?`<div class="table-wrap"><table>
 <tr><th>Amount</th><th>Status</th></tr>
 ${bills.map(b=>`<tr><td>₱${esc(b.amount)}</td><td>${esc(b.status)}</td></tr>`).join('')}
 </table></div>`:'<p>No billing records.</p>'}
 </div>`;
}
function patientPage(c){
 c.innerHTML=`
 <h1>Patients</h1>
 <div class="card">
 <h2>${editing?'Edit Patient':'Add Patient'}</h2>
 <form onsubmit="savePatient(event)">
 <div class="form-grid">
 <input id="pName" placeholder="Patient Name" required>
 <input id="pAge" type="number" min="0" placeholder="Age" required>
 <select id="pGender" required><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select>
 <input id="pContact" placeholder="Contact Number">
 <input id="pAddress" placeholder="Address">
 </div>
 <button type="submit">${editing?'Update Patient':'Save Patient'}</button>
 <button type="button" class="secondary" onclick="editing=null;page('patients')">Cancel</button>
 </form>
 </div>
 <div class="card"><h2>Patient List</h2>${patientTable()}</div>`;
 if(editing){
 let p=patients.find(x=>x.id===editing);
 if(p){
 pName.value=p.name;pAge.value=p.age;pGender.value=p.gender;
 pContact.value=p.contact;pAddress.value=p.address;
 }
 }
}
function patientTable(){
 return patients.length?`<div class="table-wrap"><table>
 <tr><th>Name</th><th>Age</th><th>Gender</th><th>Contact</th><th>Action</th></tr>
 ${patients.map(p=>`<tr>
 <td>${esc(p.name)}</td><td>${esc(p.age)}</td><td>${esc(p.gender)}</td><td>${esc(p.contact)}</td>
 <td class="actions"><button onclick="editPatient('${p.id}')">Edit</button><button class="danger" onclick="delPatient('${p.id}')">Delete</button></td>
 </tr>`).join('')}
 </table></div>`:'<p>No patients yet.</p>';
}
function savePatient(e){
 e.preventDefault();
 let obj={name:pName.value,age:pAge.value,gender:pGender.value,contact:pContact.value,address:pAddress.value};
 if(editing){
 Object.assign(patients.find(x=>x.id===editing),obj);
 }else{
 obj.id=uid();patients.push(obj);
 }
 editing=null;save();page('doctors');
}
function editPatient(id){
 editing=id;currentPage='patients';render();
}
function delPatient(id){
 if(!confirm('Delete this patient?'))return;
 patients=patients.filter(x=>x.id!==id);
 appointments=appointments.filter(x=>x.patientId!==id);
 billing=billing.filter(x=>x.patientId!==id);
 save();page('patients');
}
const specs=['General Medicine','Pediatrics','Cardiology','Dermatology','Neurology','Orthopedics','Obstetrics and Gynecology','Ophthalmology','Psychiatry','Dentistry','Surgery','Other'];
function doctorPage(c){
 c.innerHTML=`
 <h1>Doctors</h1>
 <div class="card">
 <h2>${editing?'Edit Doctor':'Add Doctor'}</h2>
 <form onsubmit="saveDoctor(event)">
 <div class="form-grid">
 <input id="dName" placeholder="Doctor Name" required>
 <select id="dSpec" required><option value="">Specialization</option>${specs.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
 <input id="dContact" placeholder="Contact">
 </div>
 <button type="submit">${editing?'Update Doctor':'Save Doctor'}</button>
 <button type="button" class="secondary" onclick="editing=null;page('doctors')">Cancel</button>
 </form>
 </div>
 <div class="card"><h2>Doctor List</h2>
 ${doctors.length?`<div class="table-wrap"><table>
 <tr><th>Name</th><th>Specialization</th><th>Contact</th><th>Action</th></tr>
 ${doctors.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.specialization)}</td><td>${esc(d.contact)}</td>
 <td class="actions"><button onclick="editDoctor('${d.id}')">Edit</button><button class="danger" onclick="delDoctor('${d.id}')">Delete</button></td></tr>`).join('')}
 </table></div>`:'<p>No doctors yet.</p>'}
 </div>`;
 if(editing){
 let d=doctors.find(x=>x.id===editing);
 if(d){dName.value=d.name;dSpec.value=d.specialization;dContact.value=d.contact;}
 }
}
function saveDoctor(e){
 e.preventDefault();
 let obj={name:dName.value,specialization:dSpec.value,contact:dContact.value};
 if(editing)Object.assign(doctors.find(x=>x.id===editing),obj);
 else{obj.id=uid();doctors.push(obj);}
 editing=null;save();page('appointments');
}
function editDoctor(id){editing=id;currentPage='doctors';render()}
function delDoctor(id){
 if(!confirm('Delete this doctor?'))return;
 doctors=doctors.filter(x=>x.id!==id);
 appointments=appointments.filter(x=>x.doctorId!==id);
 save();page('doctors');
}
function patientOptions(){
 return `<option value="">Select Patient</option>${patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}`;
}
function doctorOptions(){
 return `<option value="">Select Doctor</option>${doctors.map(d=>`<option value="${d.id}">${esc(d.name)} - ${esc(d.specialization)}</option>`).join('')}`;
}
function appointmentPage(c){
 c.innerHTML=`
 <h1>Appointments</h1>
 <div class="card"><h2>${editing?'Edit Appointment':'Add Appointment'}</h2>
 <form onsubmit="saveAppointment(event)">
 <div class="form-grid">
 <select id="aPatient" required onchange="showAppointmentPatient()">${patientOptions()}</select>
 <select id="aDoctor" required>${doctorOptions()}</select>
 <input id="aDate" type="date" required>
 <input id="aTime" type="time" required>
 <select id="aStatus"><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select>
 </div>
 <div id="aPatientInfo" class="info"></div>
 <button type="submit">${editing?'Update Appointment':'Save Appointment'}</button>
 <button type="button" class="secondary" onclick="editing=null;page('appointments')">Cancel</button>
 </form></div>
 <div class="card"><h2>Appointment List</h2>
 ${appointments.length?`<div class="table-wrap"><table>
 <tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr>
 ${appointments.map(a=>{let p=patients.find(x=>x.id===a.patientId),d=doctors.find(x=>x.id===a.doctorId);
 return `<tr><td>${esc(p?.name||'Deleted')}</td><td>${esc(d?.name||'Deleted')}</td><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(a.status)}</td><td class="actions"><button onclick="editAppointment('${a.id}')">Edit</button><button class="danger" onclick="delAppointment('${a.id}')">Delete</button></td></tr>`}).join('')}
 </table></div>`:'<p>No appointments.</p>'}
 </div>`;
 if(editing){
 let a=appointments.find(x=>x.id===editing);
 if(a){aPatient.value=a.patientId;aDoctor.value=a.doctorId;aDate.value=a.date;aTime.value=a.time;aStatus.value=a.status;showAppointmentPatient();}
 }
}
function showAppointmentPatient(){
 let p=patients.find(x=>x.id===aPatient.value);
 aPatientInfo.innerHTML=p?`<b>Patient:</b> ${esc(p.name)} | <b>Age:</b> ${esc(p.age)} | <b>Gender:</b> ${esc(p.gender)} | <b>Contact:</b> ${esc(p.contact)} | <b>Address:</b> ${esc(p.address)}`:'';
}
function saveAppointment(e){
 e.preventDefault();
 let obj={patientId:aPatient.value,doctorId:aDoctor.value,date:aDate.value,time:aTime.value,status:aStatus.value};
 if(editing)Object.assign(appointments.find(x=>x.id===editing),obj);
 else{obj.id=uid();appointments.push(obj);}
 editing=null;save();page('billing');
}
function editAppointment(id){editing=id;currentPage='appointments';render()}
function delAppointment(id){
 if(!confirm('Delete appointment?'))return;
 appointments=appointments.filter(x=>x.id!==id);
 save();page('appointments');
}
function billingPage(c){
 c.innerHTML=`
 <h1>Billing</h1>
 <div class="card"><h2>${editing?'Edit Billing':'Add Billing'}</h2>
 <form onsubmit="saveBill(event)">
 <div class="form-grid">
 <select id="bPatient" required onchange="showBillPatient()">${patientOptions()}</select>
 <input id="bAmount" type="number" min="0" step="0.01" placeholder="Amount (₱)" required>
 <select id="bStatus"><option>Pending</option><option>Paid</option><option>Unpaid</option></select>
 </div>
 <div id="bPatientInfo" class="info"></div>
 <button type="submit">${editing?'Update Billing':'Save Billing'}</button>
 <button type="button" class="secondary" onclick="editing=null;page('billing')">Cancel</button>
 </form></div>
 <div class="card"><h2>Billing List</h2>
 ${billing.length?`<div class="table-wrap"><table>
 <tr><th>Patient</th><th>Amount</th><th>Status</th><th>Action</th></tr>
 ${billing.map(b=>{let p=patients.find(x=>x.id===b.patientId);
 return `<tr><td>${esc(p?.name||'Deleted')}</td><td>₱${esc(b.amount)}</td><td>${esc(b.status)}</td><td class="actions"><button onclick="editBill('${b.id}')">Edit</button><button class="danger" onclick="delBill('${b.id}')">Delete</button></td></tr>`}).join('')}
 </table></div>`:'<p>No billing records.</p>'}
 </div>`;
 if(editing){
 let b=billing.find(x=>x.id===editing);
 if(b){bPatient.value=b.patientId;bAmount.value=b.amount;bStatus.value=b.status;showBillPatient();}
 }
}
function showBillPatient(){
 let p=patients.find(x=>x.id===bPatient.value);
 bPatientInfo.innerHTML=p?`<b>Patient:</b> ${esc(p.name)} | <b>Age:</b> ${esc(p.age)} | <b>Contact:</b> ${esc(p.contact)}`:'';
}
function saveBill(e){
 e.preventDefault();
 let obj={patientId:bPatient.value,amount:bAmount.value,status:bStatus.value};
 if(editing)Object.assign(billing.find(x=>x.id===editing),obj);
 else{obj.id=uid();billing.push(obj);}
 editing=null;save();page('dashboard');
}
function editBill(id){editing=id;currentPage='billing';render()}
function delBill(id){
 if(!confirm('Delete billing record?'))return;
 billing=billing.filter(x=>x.id!==id);
 save();page('billing');
}
start();
</script>
</body>
</html>
