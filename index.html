<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Management System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f7f5f6;color:#333}
button{cursor:pointer;border:none;border-radius:7px;padding:10px 14px}
input,select,textarea{padding:10px;border:1px solid #ddd;border-radius:7px;width:100%;margin:5px 0 12px}
.login-page{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{background:white;width:100%;max-width:400px;padding:30px;border-radius:15px;box-shadow:0 5px 25px #0001;text-align:center}
.logo{width:100px;height:100px;margin:0 auto 15px}
.logo svg{width:100%;height:100%}
.login-box h2{margin-bottom:8px}
.login-box p{color:#777;margin-bottom:15px}
.primary{background:#222;color:white}
.secondary{background:#eee;color:#222}
.danger{background:#b00020;color:white}
.layout{display:none;min-height:100vh}
.sidebar{width:240px;background:white;border-right:1px solid #eee;padding:20px;position:fixed;height:100vh}
.sidebar .logo{width:85px;height:85px;margin:0 auto 10px}
.sidebar h3{text-align:center;font-size:18px;margin-bottom:25px}
.sidebar button{width:100%;display:block;text-align:left;margin:7px 0;background:white;color:#333;padding:12px}
.sidebar button:hover,.sidebar button.active{background:#eee;font-weight:bold}
.main{margin-left:240px;padding:25px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.topbar input{max-width:350px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:25px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #00005}
.card h3{font-size:14px;color:#777;margin-bottom:10px}
.card strong{font-size:25px}
.panel{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
.panel h2{margin-bottom:15px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}
th{background:#f7f7f7}
.table-wrap{overflow-x:auto}
.modal{display:none;position:fixed;inset:0;background:#0006;justify-content:center;align-items:center;padding:15px;z-index:5}
.modal-box{background:white;padding:25px;border-radius:12px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.modal-box h2{margin-bottom:15px}
.modal-box button{margin-right:5px}
.actions button{margin:3px}
#detailView{display:none}
.notice{font-size:12px;color:#777;margin-top:15px}
@media(max-width:700px){
.sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid #eee}
.sidebar .logo{width:60px;height:60px}
.sidebar h3{margin-bottom:10px}
.sidebar button{width:auto;display:inline-block}
.main{margin-left:0;padding:15px}
